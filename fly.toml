app = 'pleno-anonymize'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # auto_stop=off keeps fly from stopping the machine; auto_start=true lets
  # the proxy cold-start it back if the machine ever lands in 'stopped' state
  # (deploy update transient, platform action). PR #45 set auto_start=false
  # together with auto_stop=off, which created a no-recovery trap: once the
  # machine fell into 'stopped' the proxy refused to restart it and every
  # request 503'd while the machine API still saw the machine as 'active'.
  # min_machines_running is a no-op when auto_stop_machines='off' (fly only
  # honors it for 'stop'/'suspend'), so it's removed.
  auto_stop_machines = 'off'
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # fly silently caps grace_period to 60s (warns at deploy time); keep it at
    # the documented max. Cold-start budget moves to the CI curl-side retry.
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  # 2gb (was 1gb) — model footprint (ja_ner_ja + en_core_web_sm + Presidio
  # recognizers + AnonymizerEngine + Pillow + httpx) leaves <100MB headroom on
  # 1gb, risking OOM-kill during proxy request handling. 2gb gives margin.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
