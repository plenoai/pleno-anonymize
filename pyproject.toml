[tool.uv.workspace]
# `packages/recognizers` was merged into `packages/sdk` as
# `pleno_anonymize.recognizers` (PR #138) and is intentionally not a member.
members = [
    "server",
    "packages/training",
    "packages/sdk",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "SIM", "RUF"]
# E501: line-length not enforced (pre-existing long doc-strings)
# RUF001: ambiguous unicode chars — intentional in Japanese regex patterns (ja.py)
ignore = ["E501", "RUF001"]
