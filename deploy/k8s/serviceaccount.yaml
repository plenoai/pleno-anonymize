apiVersion: v1
kind: ServiceAccount
metadata:
  name: pii-scanner
  namespace: security
  annotations:
    # AWS IRSA — bind this SA to an IAM role for STS:AssumeRole.
    # Fill in for AWS S3 connector. Comment out otherwise.
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pii-scanner
    #
    # GCP Workload Identity — bind to a GSA. Fill in for GCS / BigQuery.
    # iam.gke.io/gcp-service-account: pii-scanner@my-project.iam.gserviceaccount.com
    #
    # Azure Workload Identity — bind to an Azure AD federated credential.
    # Fill in for Azure Blob / Azure DevOps.
    # azure.workload.identity/client-id: <azure-client-id>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pii-scanner-state
  namespace: security
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi   # SQLite checkpoint + findings shards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pii-scanner-config
  namespace: security
data:
  scan.toml: |
    # Example scan config — replace with your real connector setup.
    # See packages/pii-scanner/README.md for the full schema.
    [github]
    app_id = "123456"
    private_key_env = "GITHUB_APP_PRIVATE_KEY"
    organizations = ["acme-corp"]
    archived = false
---
# Secret stub — populate keys via your secret manager (Vault Agent
# Injector, External Secrets Operator, sealed-secrets, etc). Do NOT
# commit real secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: pii-scanner-secrets
  namespace: security
type: Opaque
stringData:
  findings-master-key: "REPLACE_WITH_BASE64_32_BYTES"
  github-app-private-key: "REPLACE_WITH_PEM"
