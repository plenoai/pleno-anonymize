[project]
name = "pleno-pii-scanner"
version = "0.1.0"
description = "PII scanner for source repositories with gitleaks/trufflehog-like UX"
requires-python = ">=3.12"
dependencies = [
    "pleno-recognizers",
    "click>=8.1",
    "pathspec>=0.12",
    "httpx>=0.27.0",
    # Default scan path runs Presidio with spaCy NER on ja_ner_ja. Cloud mode
    # via --base-url is an offload, not a substitute.
    "spacy[ja]>=3.8",
    "presidio-analyzer>=2.2",
    "ja-ner-ja",
]

[project.scripts]
pleno-pii-scanner = "pleno_pii_scanner.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
pleno-recognizers = { workspace = true }
ja-ner-ja = { url = "https://huggingface.co/0xhikae/ja-ner-ja/resolve/main/ja_ner_ja-0.2.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner"]
