[project]
name = "pleno-pii-scanner-slack"
version = "0.1.0"
description = "Slack SourceConnector wheel for pleno-pii-scanner — bot/user/org-wide xoxa + Discovery API"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "slack", "scanner", "dlp", "discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Communications :: Chat",
]
dependencies = [
    # Core protocol + scheduler primitives (RateLimited exception, BucketKey).
    # Pinned to the workspace member so this wheel inherits whatever the core
    # repo currently ships and we don't have to chase compatible version ranges
    # for the in-tree development setup.
    "pleno-pii-scanner",
    # AsyncWebClient + WebhookClient + retry handlers. 3.27 is the first release
    # that fixed the `Retry-After` header parsing for app-level rate limits in
    # the async path, which the connector relies on to surface RateLimited.
    "slack-sdk>=3.27",
    # `slack_sdk.web.async_client.AsyncWebClient` imports aiohttp at module
    # load time even when tests stub it out — pin it explicitly so the
    # wheel doesn't surprise installers with a transitive optional that
    # slack-sdk's own `aiohttp` extra hides.
    "aiohttp>=3.10",
    # Used by `_filemirror.fetch_file_bytes` — the slack-sdk download path
    # buffers entire payloads into memory; we want streaming for large file
    # uploads so we hit the Slack file CDN with a Bearer-authed httpx client
    # directly. Already a transitive dep of pleno-pii-scanner core but pinned
    # here for clarity.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

# WHY entry-point only (no [project.scripts]): per task #24 anti-requirements,
# this wheel must NOT add a `pleno-pii-scanner-slack` CLI; routing happens via
# the core registry (`pleno-pii-scanner scan slack ...`). Adding a script here
# would shadow the registry path and confuse operators about which entry is
# canonical.
[project.entry-points."pleno_pii_scanner.connectors"]
slack = "pleno_pii_scanner_slack:SPEC"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pleno_pii_scanner_slack"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_slack"]
