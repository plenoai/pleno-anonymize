[project]
name = "pleno-pii-scanner-gcs"
version = "0.1.0"
description = "Google Cloud Storage SourceConnector for pleno-pii-scanner — Workload Identity Federation + Cloud Asset Inventory bucket discovery (ADR-0007 §13)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "gcs", "gcp", "trufflehog", "dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# WHY each dep is here:
#   pleno-pii-scanner — Protocol contract (workspace pin: see [tool.uv.sources]).
#   httpx             — Single transport for the JSON API, OAuth2 token exchange,
#                       AND Cloud Asset Inventory. Matches the OCI connector and
#                       lets tests use `httpx.MockTransport` to stay hermetic
#                       (no google-cloud-storage SDK on the dependency surface
#                       so security teams audit a small graph).
#   cryptography      — Sign service-account JWTs (RS256) for the OAuth2
#                       grant. The google-auth SDK pulls this in too; we
#                       depend on it directly so the version range is explicit
#                       and the wheel set stays minimal.
dependencies = [
    "pleno-pii-scanner",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Discovered by `pleno_pii_scanner.sources.registry._import_entry_points`.
# The unified CLI dispatches `pleno-pii-scanner scan gcs` to SPEC.factory.
gcs = "pleno_pii_scanner_gcs:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
branch = false
source = ["src/pleno_pii_scanner_gcs"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_gcs"]
