[project]
name = "pleno-pii-scanner-aws"
version = "0.1.0"
description = "AWS S3 SourceConnector for pleno-pii-scanner — multi-account assume-role + reservoir sampling + inventory diff (ADR-0007 §13, §16)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "aws", "s3", "trufflehog", "dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# WHY each dep is here:
#   pleno-pii-scanner — Protocol contract (workspace pin: see [tool.uv.sources])
#   aioboto3          — Async S3 client + STS assume-role; native async I/O so a
#                       fan-out over hundreds of accounts does not need a thread
#                       pool to stay event-loop-friendly.
#   aiobotocore       — Pinned transitive dependency that aioboto3 leans on; we
#                       declare it explicitly so resolver sees the >=2.13 floor
#                       (older releases lack the streaming `iter_chunks` we use
#                       on ranged GET responses).
dependencies = [
    "pleno-pii-scanner",
    "aioboto3>=13",
    "aiobotocore>=2.13",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Discovered by `pleno_pii_scanner.sources.registry._import_entry_points`.
# The unified CLI dispatches `pleno-pii-scanner scan aws-s3` to SPEC.factory.
aws-s3 = "pleno_pii_scanner_aws:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
branch = false
source = ["src/pleno_pii_scanner_aws"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_aws"]
