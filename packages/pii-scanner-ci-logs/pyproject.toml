[project]
name = "pleno-pii-scanner-ci-logs"
version = "0.1.0"
description = "CI build-log SourceConnector (GitHub Actions / CircleCI / Buildkite / Jenkins) for pleno-pii-scanner"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = [
    "pii",
    "scanner",
    "ci",
    "github-actions",
    "circleci",
    "buildkite",
    "jenkins",
    "secrets",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Core protocol + RateLimited live in pleno-pii-scanner; pinned via
    # workspace below so this wheel inherits the in-tree development build.
    "pleno-pii-scanner",
    # We hand-roll all four CI REST clients on top of httpx instead of
    # the per-vendor SDKs (`PyGithub`, `pybuildkite`, ...): each SDK adds
    # blocking I/O, drags in `requests`, and provides no transport seam
    # for hermetic tests. Sharing one HTTP layer across flavors also
    # keeps rate-limit handling uniform.
    "httpx>=0.27",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Single connector kind; the wire flavor is selected by config
# (`flavor = "github_actions" | "circleci" | "buildkite" | "jenkins"`).
# CI log scanning is uniform from the scheduler's perspective — the
# only per-vendor differences are URL shape, paginator semantics, and
# auth header. Splitting into four wheels would force operators to
# install four packages even though they always ship one CI vendor
# per scan profile.
ci_logs = "pleno_pii_scanner_ci_logs:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pleno_pii_scanner_ci_logs"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_ci_logs"]
