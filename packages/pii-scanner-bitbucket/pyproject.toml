[project]
name = "pleno-pii-scanner-bitbucket"
version = "0.1.0"
description = "Bitbucket Cloud + Bitbucket Server (Data Center) SourceConnector for pleno-pii-scanner"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "bitbucket", "atlassian", "data-center", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Core protocol + RateLimited live in pleno-pii-scanner; pinned via
    # workspace below so this wheel inherits the in-tree development build.
    "pleno-pii-scanner",
    # We hand-roll the Bitbucket Cloud + Server REST clients on top of
    # httpx instead of `atlassian-python-api` because that SDK pulls in
    # six + requests + deprecated transitive crypto dependencies and does
    # not support a pluggable transport (the test seam we rely on).
    "httpx>=0.27",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Single connector kind, two wire flavors selected by config (`flavor =
# "cloud" | "server"`). Bitbucket Cloud and Bitbucket Server / Data
# Center are completely different APIs (api.bitbucket.org/2.0 vs
# <host>/rest/api/1.0); we keep them under one wheel because operators
# usually pick one or the other per source profile and a split would
# duplicate auth + clone seams across two near-identical packages.
bitbucket = "pleno_pii_scanner_bitbucket:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pleno_pii_scanner_bitbucket"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_bitbucket"]
