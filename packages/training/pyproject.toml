[project]
name = "pleno-ner-training"
version = "0.1.0"
requires-python = ">=3.12"
# Server image (production) install minimum.
# spacy-transformers (torch + nvidia CUDA libs ~3GB) and openai (training-only)
# moved to [training] extra. fly.io shared-cpu-1x rootfs 8GB limit was
# silent-failing image unpack — root cause of stuck production deploys (#47).
dependencies = [
    "spacy[ja]>=3.8",
    "jinja2>=3.1",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
# Training-only deps. Use `uv sync --extra training` (or `--all-extras`).
training = [
    "spacy-transformers>=1.3",
    "openai>=2.50.0",
    "pyyaml>=6.0.3",
    # scripts/runpod_train.py talks to the RunPod REST API directly. Already
    # present transitively via openai, but declared explicitly so it isn't
    # silently lost if that transitive path ever changes (#292).
    "requests>=2.34.2",
]
hf = [
    "transformers>=4.40",
    "datasets>=2.19",
    "seqeval>=1.2",
    "accelerate>=0.30",
    "optimum[onnxruntime]>=1.19",
    "huggingface-hub>=0.23",
    # deberta-v3-xsmall (en) ships a SentencePiece tokenizer.model that
    # transformers' fast-tokenizer converter cannot rebuild without these
    # two backends. Without them, AutoTokenizer.from_pretrained raises
    # `Converting from SentencePiece and Tiktoken failed`. Required for
    # convert-hf-en-v01-tiny / train-hf-en-v01-tiny / export-onnx-en-v01-tiny.
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
]
# OSS baseline + Presidio benchmarking deps. Excluded from server image build
# via `uv sync --no-group bench` (see Dockerfile). ja_core_news_trf wheel URL
# pinned to 3.8.0 (latest as of 2026-05-02). sha256 inline pin to be added in
# follow-up if uv-add does not derive automatically (R16).
bench = [
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.363",
    "ginza>=5.2",
    "ja-ginza>=5.2",
    "numpy>=1.26",
    "scipy>=1.18.0",
    "ja-core-news-trf @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_trf-3.8.0/ja_core_news_trf-3.8.0-py3-none-any.whl",
    "ja-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_lg-3.8.0/ja_core_news_lg-3.8.0-py3-none-any.whl",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[dependency-groups]
# `uv run pytest` must resolve from within packages/training itself — this
# package ships its own uv.lock so it can be scp'd to a RunPod pod standalone
# (project CLAUDE.md: do not train on local machine); the workspace-root
# sdk dev group does not carry over here. Mirrors
# packages/sdk/pyproject.toml's dev group.
# jsonschema: validates experiment log entries against
# experiments/log_schema.json before every log_experiment.py append (#293).
# Not a runtime dependency of the shipped model/SDK, so it lives in dev
# rather than [project.dependencies] or an extra.
dev = [
    "pytest>=9.1.1",
    "jsonschema>=4.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# `bench` extras に ja_core_news_trf wheel URL (direct reference) を含むため必要
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_ner_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests requiring heavy model loads (deselected by default; run with `-m slow`)",
]
addopts = "-m 'not slow'"
