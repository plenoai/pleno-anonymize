[project]
name = "pleno-pii-scanner-mysql"
version = "0.1.0"
description = "MySQL SourceConnector for pleno-pii-scanner (replica + RAND() sampling + binlog incremental)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "mysql", "scanner", "trufflehog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # Pure-async MySQL driver. aiomysql wraps PyMySQL so it ships
    # without a libmysqlclient runtime requirement, which keeps the
    # scanner image slim and works inside distroless containers.
    "aiomysql>=0.2.0",
    # Workspace dependency: the connector implements SourceConnector
    # from the core wheel, so they version together.
    "pleno-pii-scanner",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Routed by the unified CLI as `pleno-pii-scanner scan mysql`.
mysql = "pleno_pii_scanner_mysql:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_mysql"]
