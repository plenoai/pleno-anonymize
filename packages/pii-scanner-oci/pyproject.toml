[project]
name = "pleno-pii-scanner-oci"
version = "0.1.0"
description = "Daemon-less OCI registry SourceConnector for pleno-pii-scanner"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "oci", "container", "scanner", "trufflehog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # ADR §15: HTTP 直叩き. docker-py prohibited (requires daemon mount,
    # which CI / k8s pod / gVisor sandbox forbids). httpx covers every
    # registry's REST surface.
    "httpx>=0.27",
    # zstd: required for OCI layers compressed with the modern algorithm
    # (`application/vnd.oci.image.layer.v1.tar+zstd`). gzip is stdlib.
    "zstandard>=0.22",
    "pleno-pii-scanner",
]

[project.entry-points."pleno_pii_scanner.connectors"]
oci = "pleno_pii_scanner_oci:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_oci"]
