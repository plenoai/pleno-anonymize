[project]
name = "pleno-pii-scanner-saas-scraper"
version = "0.1.0"
description = "saas-scraper-backed SourceConnector for pleno-pii-scanner — Chrome-driven Slack / GitHub / GitLab / Bitbucket / Jira / Confluence / Notion content via inherited SSO sessions"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "saas", "chrome", "slack", "github", "notion", "jira"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Core protocol + Capabilities + ConnectorSpec live in pleno-pii-scanner;
    # pinned via workspace below for in-tree development.
    "pleno-pii-scanner",
    # The browser-driven content collection layer. We pin >=0.5 because we
    # rely on the multi-resource GitHub connector (issues + PRs) introduced
    # in saas-scraper 0.5.0; older versions only exposed the file tree.
    "saas-scraper>=0.5.0",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# A single connector kind covers all saas-scraper providers. The
# underlying provider (slack, github, gitlab, ...) is selected by
# `config.scraper_kind`. Splitting into per-provider kinds would force
# every user to reconfigure their pipeline when saas-scraper adds a new
# connector — the indirection lets us absorb that growth without
# touching this wheel.
saas-scraper = "pleno_pii_scanner_saas_scraper:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize/tree/main/packages/pii-scanner-saas-scraper"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pleno_pii_scanner_saas_scraper"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_saas_scraper"]
