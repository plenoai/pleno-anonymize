[project]
name = "pleno-pii-scanner-saas-retriever"
version = "0.2.0"
description = "saas-retriever-backed SourceConnector for pleno-pii-scanner — API-only org-wide GitHub (slack / jira / confluence / notion / gitlab / bitbucket land in subsequent saas-retriever releases)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "saas", "github", "secrets", "dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Core protocol + Capabilities + ConnectorSpec live in pleno-pii-scanner;
    # pinned via workspace below for in-tree development.
    "pleno-pii-scanner",
    # API-driven content collection (httpx; no Chromium). >=0.1 because
    # the package was reborn at 0.1 as the API-only successor to
    # saas-scraper. Pin floors per provider as new connectors land.
    "saas-retriever>=0.1.0",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# A single connector kind covers all saas-retriever providers. The
# underlying provider (github today; slack / jira / ... as they land)
# is selected by `config.connector_kind`. Splitting into per-provider
# kinds would force every user to reconfigure their pipeline whenever
# saas-retriever adds a new connector — the indirection lets us absorb
# that growth without touching this wheel.
saas-retriever = "pleno_pii_scanner_saas_retriever:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize/tree/main/packages/pii-scanner-saas-retriever"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pleno_pii_scanner_saas_retriever"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_saas_retriever"]
