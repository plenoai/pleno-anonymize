[project]
name = "pleno-pii-scanner-gitlab"
version = "0.1.0"
description = "GitLab SourceConnector for pleno-pii-scanner: SaaS gitlab.com + self-managed (CE/EE), PAT/OAuth/Project tokens, recursive group enumeration"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "gitlab", "self-managed", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Core protocol + RateLimited live in pleno-pii-scanner.
    "pleno-pii-scanner",
    # httpx for the GitLab REST API. We deliberately do NOT depend on
    # python-gitlab: it is sync-only (we run inside the async scheduler),
    # forces requests + urllib3 into the dep tree, and gives us no
    # leverage over self-managed CA bundles vs httpx's `verify=` arg.
    "httpx>=0.27",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Kind chosen as `gitlab` (not `gitlab-api`); there is no zero-deps
# builtin gitlab connector, so the kind is unambiguous.
gitlab = "pleno_pii_scanner_gitlab:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_gitlab"]
