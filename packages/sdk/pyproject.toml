[project]
name = "pleno-anonymize"
version = "0.2.0"
description = "Local-first Japanese PII detection and redaction. SDK + `pleno-anonymize` CLI sharing the same recognizer registry and NER pipeline as the pleno-anonymize server."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "redaction", "anonymize", "presidio", "japanese", "ner", "scanner", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: Console",
]
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy[ja]>=3.8",
]

[project.optional-dependencies]
remote = ["httpx>=0.27"]
# OpenAI Privacy Filter (openai/privacy-filter, Apache 2.0). Adds torch
# (~2GB) plus a ~1.5B-parameter checkpoint download on first use, so we
# keep it out of the default install to preserve the slim local-first
# footprint.
openai = ["opf>=0.1"]

[project.scripts]
pleno-anonymize = "pleno_anonymize._cli:main"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_anonymize"]
