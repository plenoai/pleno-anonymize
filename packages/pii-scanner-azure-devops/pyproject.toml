[project]
name = "pleno-pii-scanner-azure-devops"
version = "0.1.0"
description = "Azure DevOps Services + Server SourceConnector for pleno-pii-scanner: PAT / OAuth / federated (OIDC) auth, project + repo enumeration, shallow-clone scan"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = [
    "pii",
    "scanner",
    "azure-devops",
    "tfs",
    "secrets",
    "trufflehog",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Workspace dep for Protocol + RateLimited; same pattern as the
    # pii-scanner-github wheel. We avoid the official `azure-devops`
    # SDK: it pulls msrest, msrest-azure, and a 6 MB code-gen surface
    # we'd touch <1% of, and is sync-only (we are async end-to-end).
    "pleno-pii-scanner",
    "httpx>=0.27",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Connector kind chosen as `azure_devops` (snake-case to match the
# entry-point name) so the unified CLI routes
# `pleno-pii-scanner scan azure_devops` here. Both Services
# (dev.azure.com) and Server (on-prem) are served by this single kind;
# the `flavor` config switch picks the URL shape.
azure_devops = "pleno_pii_scanner_azure_devops:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_azure_devops"]
