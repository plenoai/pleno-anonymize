[project]
name = "pleno-pii-scanner-confluence"
version = "0.1.0"
description = "Atlassian Confluence (Cloud + Data Center) SourceConnector for pleno-pii-scanner"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "confluence", "atlassian", "data-center", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Office/Business",
]
dependencies = [
    # Core protocol + RateLimited; pinned via the workspace below so this
    # wheel inherits the in-tree development build instead of resolving
    # an external version range.
    "pleno-pii-scanner",
    # Direct httpx — no atlassian-python-api: it depends on requests +
    # six (sync only, no transport seam), which would defeat the
    # MockTransport-based hermetic test discipline.
    "httpx>=0.27",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Single connector kind, two wire flavors selected by config
# (`flavor = "cloud" | "datacenter"`). Cloud uses
# `https://{site}.atlassian.net/wiki/rest/api/...` (v1) plus the
# v2 host `https://api.atlassian.com/ex/confluence/{cloudId}/...`;
# Data Center uses `<base_url>/rest/api/...`. They share auth shapes
# and the storage-format XHTML body, but differ on pagination and
# 429/503 backoff. Keeping them under one wheel mirrors the Bitbucket
# package and matches the operator's "pick one per source profile" mental
# model.
confluence = "pleno_pii_scanner_confluence:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pleno_pii_scanner_confluence"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 99

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_confluence"]
