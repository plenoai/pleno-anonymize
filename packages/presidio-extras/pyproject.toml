[project]
name = "pleno-presidio-extras"
version = "0.1.1"
description = "Optional Presidio custom elements from pleno. Currently JevContextFilter, a context-aware enhancer that removes confident false positives via TypeSafe's Jev API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "39324739+HikaruEgashira@users.noreply.github.com" }]
keywords = ["pii", "presidio", "anonymize", "context", "false-positive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]
# Only the Presidio extension point, not the pleno-anonymize SDK: these
# elements stay usable with a vanilla Presidio AnalyzerEngine.
dependencies = [
    "presidio-analyzer>=2.2.364",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Integration test wires the enhancer into the SDK's local engine.
    "pleno-anonymize",
]

[tool.uv.sources]
pleno-anonymize = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
# Pinned so the published wheel/sdist is reproducible over time; uv.lock does
# not cover build-system.requires. Bump deliberately alongside releases.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_presidio_extras"]
