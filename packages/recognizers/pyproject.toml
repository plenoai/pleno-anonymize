[project]
name = "pleno-recognizers"
version = "0.1.0"
description = "Pure-Python PII recognizer definitions (regex + checksum validators) shared across pleno-anonymize server and scanner"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_recognizers"]
