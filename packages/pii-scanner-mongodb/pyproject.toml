[project]
name = "pleno-pii-scanner-mongodb"
version = "0.1.0"
description = "MongoDB SourceConnector for pleno-pii-scanner ($sample + change stream + secondary enforcement)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "mongodb", "scanner", "trufflehog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # Official async MongoDB driver (Tornado/asyncio). ≥3.5 ships the
    # current `change_stream.resume_after` semantics and full type stubs.
    "motor>=3.5",
    # Workspace dependency: the connector implements SourceConnector
    # from the core wheel, so they version together.
    "pleno-pii-scanner",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Routed by the unified CLI as `pleno-pii-scanner scan mongodb`.
mongodb = "pleno_pii_scanner_mongodb:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_mongodb"]
