[project]
name = "pleno-pii-scanner-github"
version = "0.2.0"
description = "Enterprise GitHub connector for pleno-pii-scanner: GitHub App auth + GHES + org / enterprise enumeration via REST/GraphQL (no gh-CLI, no PyGithub)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["pii", "scanner", "github", "github-app", "ghes", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Core protocol + RateLimited / retry_async live in pleno-pii-scanner.
    # `cryptography` is already a transitive core dep (envelope encryption
    # for FindingsStore §11) so JWT signing here adds no new wheel.
    # >=0.3.0 pins the IncrementalSourceConnector / Subsource symbols this
    # connector now imports from `pleno_pii_scanner.sources.base`.
    "pleno-pii-scanner>=0.3.0",
    "httpx>=0.27",
]

[project.entry-points."pleno_pii_scanner.connectors"]
# Kind chosen as `github-app` to disambiguate from the zero-deps builtin
# `github` (shallow-clone + gh CLI). `github-enterprise` would be misleading
# because GHES is an opt-in `base_url` setting, not a requirement — this
# wheel works against api.github.com just as well.
github-app = "pleno_pii_scanner_github:SPEC"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-anonymize"
Source = "https://github.com/plenoai/pleno-anonymize"
Issues = "https://github.com/plenoai/pleno-anonymize/issues"

[tool.uv.sources]
pleno-pii-scanner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_pii_scanner_github"]
