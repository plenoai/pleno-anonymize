[project]
name = "pleno-anonymize-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.27.0",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2",
    "spacy[ja]>=3.8",
    "uvicorn[standard]>=0.50.2",
    "scalar-fastapi>=1.6.0",
    "pleno-anonymize",
]

[tool.uv.sources]
pleno-anonymize = { workspace = true }

[project.optional-dependencies]
image = [
    "presidio-image-redactor>=0.0.53",
    "pillow>=12.3.0",
]
appi = [
    "onnxruntime>=1.27.0",
    "transformers>=4.50",
]
proxy = [
    "openai>=2.44.0",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
