name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/training/output/scores.json'
      - 'packages/training/output/en-transformer/scores.json'
      - 'packages/training/output/en/scores.json'
      - 'packages/training/output/ja/external_scores.json'
      - 'packages/training/output/en/external_scores.json'
      - '.github/workflows/website.yml'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9
      # No `cache: pnpm` here: this workflow is reachable through
      # `workflow_dispatch` and pushes to the default branch, so a persistent
      # dependency cache could be poisoned and then read by every later build
      # (sisakulint `cache-poisoning` cache-hierarchy warning). The site build
      # is short enough that paying for a cold install is preferable to
      # sharing a default-branch cache with an externally triggerable workflow.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
