name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check server/src/
      - run: uvx ruff format --check server/src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: server
      - run: uv run pytest tests/ -v
        working-directory: server

  deploy:
    needs: [check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pleno-anonymize
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pleno-anonymize:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --strategy immediate destroys the existing machine and creates a fresh
      # one. Default `rolling` does an in-place update which previously inherited
      # corrupt state ([PM07] machine still active, refusing to start) on
      # machine 185173db175798 and re-broke /ready across consecutive deploys.
      - run: flyctl deploy --local-only --strategy immediate --image pleno-anonymize:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Catches deploys where the image starts but cannot load NER models.
      # Background: PR #40 fixed a regression where `/health` returned 200
      # (process running) but `/api/analyze` 500'd because models could not
      # be resolved. `/ready` exercises the model-load path.
      #
      # Per-attempt --max-time is generous (60s) so a single curl can ride out
      # the worst-case cold-start; outer loop adds margin in case fly.io
      # routing settles slowly. Total budget ~6 minutes.
      - name: Verify /ready after deploy
        id: ready_check
        run: |
          set -u
          ok=0
          for i in $(seq 1 12); do
            response=$(curl -sS --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 \
              -w "\n__STATUS=%{http_code} CONNECT=%{time_connect}s TOTAL=%{time_total}s" \
              -H "Accept: application/json" https://pleno-anonymize.fly.dev/ready 2>&1 || true)
            echo "attempt $i:"
            echo "$response" | sed 's/^/  /'
            body=$(echo "$response" | head -n -1)
            if echo "$body" | grep -q '"status": *"ready"'; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::/ready did not return status=ready within ~6m after deploy"
            exit 1
          fi
          echo "::notice::/ready is healthy"

      # Diagnostic: dump fly machine status + recent logs when /ready fails.
      # Without this we are blind to whether uvicorn started, the warmup
      # thread crashed, or the proxy is routing to a dead machine.
      - name: Diagnose deploy on healthcheck failure
        if: failure() && steps.ready_check.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== flyctl status ==="
          flyctl status --app pleno-anonymize || true
          echo ""
          echo "=== flyctl machine list ==="
          flyctl machine list --app pleno-anonymize || true
          echo ""
          echo "=== flyctl logs (last 300 lines) ==="
          # --no-tail returns recent buffer then exits; cap to 300 lines.
          timeout 30 flyctl logs --app pleno-anonymize --no-tail 2>&1 | tail -300 || true
