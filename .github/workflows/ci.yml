name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check server/src/
      - run: uvx ruff format --check server/src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: server
      - run: uv pip install en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
        working-directory: server
      - run: uv run pytest tests/ -v
        working-directory: server

  deploy:
    needs: [check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pleno-anonymize
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pleno-anonymize:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: flyctl deploy --local-only --image pleno-anonymize:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
