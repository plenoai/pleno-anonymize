name: Release pleno-presidio-extras to PyPI

# Trusted publishing for the optional Presidio extensions package.
#
#   pleno-presidio-extras (optional Presidio custom elements; currently
#   JevContextFilter). Separate from the pleno-anonymize SDK so it is never
#   installed by default and can be released on its own cadence.
#
# Tag convention:
#   presidio-extras/vX.Y.Z -> packages/presidio-extras (PyPI name: pleno-presidio-extras)
#
# PyPI side: the project needs a GitHub Actions trusted publisher configured.
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'presidio-extras/v*'
  # Manual runs are build-only: there is deliberately no `dry_run` input, so a
  # dispatch (from any branch or tag) can never reach PyPI. Publishing happens
  # only in the `publish` job, which runs solely on a pushed version tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Dry run for manual dispatch. No `id-token` permission, so this job cannot
    # obtain a PyPI trusted-publishing token.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Unique per setup-uv step; see the comment in the `publish` job.
          cache-suffix: release-presidio-extras-build

      - name: Build wheel and sdist
        working-directory: packages/presidio-extras
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/presidio-extras
        run: ls -la dist

  publish:
    # Only a pushed `presidio-extras/vX.Y.Z` tag may publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/presidio-extras/v')
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC). Scoped to this tag-push
      # job only.
      id-token: write
      contents: read
    concurrency:
      group: release-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Distinct key: setup-uv's default `**/uv.lock` key is shared per
          # repository ref, so a release dispatched against the same ref as CI
          # (or as another workflow) could race to save it and log "Unable to
          # reserve cache ... another job may be creating this cache". Every
          # setup-uv step therefore carries a unique `cache-suffix` so no two
          # can compute the same key (see .github/workflows/ci.yml, guarded by
          # packages/sdk/tests/test_ci_workflow.py). `save-cache` is not a
          # setup-uv input, so it cannot be used to opt out of saving.
          cache-suffix: release-presidio-extras

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME##*/v}"
          pkg_version=$(uvx --from "tomli>=2.0" python -c "
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          " packages/presidio-extras/pyproject.toml)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${REF_NAME} does not match packages/presidio-extras/pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build wheel and sdist
        working-directory: packages/presidio-extras
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/presidio-extras
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/presidio-extras/dist
          # Duplicate-version protection: fail rather than silently skip if
          # this version already exists on PyPI.
          skip-existing: false
