name: Release pleno-presidio-extras to PyPI

# Trusted publishing for the optional Presidio extensions package.
#
#   pleno-presidio-extras (optional Presidio custom elements; currently
#   JevContextFilter). Separate from the pleno-anonymize SDK so it is never
#   installed by default and can be released on its own cadence.
#
# Tag convention:
#   presidio-extras/vX.Y.Z -> packages/presidio-extras (PyPI name: pleno-presidio-extras)
#
# Only a tag push publishes; workflow_dispatch is a build-only check with no
# OIDC token. The publish job fails if the tag does not match pyproject.toml
# or the version is already on PyPI (skip-existing: false).
#
# PyPI side: the project needs a GitHub Actions trusted publisher configured.
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'presidio-extras/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Build-only check (dispatch or tag push): no id-token, no upload.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Distinct key per job: setup-uv's default `**/uv.lock` key is shared
          # per repository ref, so concurrent jobs could race to save it. Every
          # setup-uv step carries a unique `cache-suffix` (guarded by
          # packages/sdk/tests/test_ci_workflow.py).
          cache-suffix: release-presidio-extras-build

      - name: Build wheel and sdist
        working-directory: packages/presidio-extras
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/presidio-extras
        run: ls -la dist

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/presidio-extras/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC). Only this job has it.
      id-token: write
      contents: read
    concurrency:
      group: release-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Distinct key per job: setup-uv's default `**/uv.lock` key is shared
          # per repository ref, so concurrent jobs could race to save it. Every
          # setup-uv step carries a unique `cache-suffix` (guarded by
          # packages/sdk/tests/test_ci_workflow.py).
          cache-suffix: release-presidio-extras-publish

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME##*/v}"
          pkg_version=$(uvx --from "tomli>=2.0" python -c "
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          " packages/presidio-extras/pyproject.toml)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${REF_NAME} does not match packages/presidio-extras/pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build wheel and sdist
        working-directory: packages/presidio-extras
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/presidio-extras
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/presidio-extras/dist
          # Re-publishing an existing version must fail, not silently pass.
          skip-existing: false
