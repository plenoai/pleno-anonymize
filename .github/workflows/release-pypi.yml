name: Release packages to PyPI

# Trusted publishing for the recognizer registry. Only `pleno-recognizers`
# ships from this monorepo as a wheel — the server is delivered as a Docker
# image, and NER models are released as Hugging Face artifacts.
#
# Tag convention:
#   recognizers/vX.Y.Z   -> packages/recognizers
#
# PyPI side: the project must have a GitHub Actions trusted publisher
# configured (or a Pending Publisher for the first release).
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'recognizers/v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build wheel but skip PyPI upload'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
      contents: read
    concurrency:
      group: release-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Resolve dry-run flag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            dry_run="false"
          else
            dry_run="${INPUT_DRY_RUN:-true}"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        working-directory: packages/recognizers
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/recognizers
        run: ls -la dist

      - name: Publish to PyPI
        if: steps.resolve.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/recognizers/dist
