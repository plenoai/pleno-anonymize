name: Release pleno-anonymize to PyPI

# Trusted publishing for the unified SDK wheel.
#
#   pleno-anonymize (SDK + CLI; bundles the recognizer registry that used to
#   ship as the separate pleno-recognizers package — merged in 0.2.0)
#
# Server is delivered as a Docker image; NER models live on Hugging Face.
#
# Tag convention:
#   sdk/vX.Y.Z -> packages/sdk (PyPI name: pleno-anonymize)
#
# Only a tag push publishes; workflow_dispatch is a build-only check with no
# OIDC token. The publish job fails if the tag does not match pyproject.toml
# or the version is already on PyPI (skip-existing: false).
#
# PyPI side: the project needs a GitHub Actions trusted publisher configured.
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'sdk/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Build-only check (dispatch or tag push): no id-token, no upload.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Distinct key per job: setup-uv's default `**/uv.lock` key is shared
          # per repository ref, so concurrent jobs could race to save it. Every
          # setup-uv step carries a unique `cache-suffix` (guarded by
          # packages/sdk/tests/test_ci_workflow.py).
          cache-suffix: release-pypi-build

      - name: Build wheel and sdist
        working-directory: packages/sdk
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/sdk
        run: ls -la dist

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC). Only this job has it.
      id-token: write
      contents: read
    concurrency:
      group: release-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Distinct key per job: setup-uv's default `**/uv.lock` key is shared
          # per repository ref, so concurrent jobs could race to save it. Every
          # setup-uv step carries a unique `cache-suffix` (guarded by
          # packages/sdk/tests/test_ci_workflow.py).
          cache-suffix: release-pypi-publish

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME##*/v}"
          pkg_version=$(uvx --from "tomli>=2.0" python -c "
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          " packages/sdk/pyproject.toml)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${REF_NAME} does not match packages/sdk/pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build wheel and sdist
        working-directory: packages/sdk
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/sdk
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/sdk/dist
          # Re-publishing an existing version must fail, not silently pass.
          skip-existing: false
