name: Release pleno-anonymize to PyPI

# Trusted publishing for the unified SDK wheel.
#
#   pleno-anonymize (SDK + CLI; bundles the recognizer registry that used to
#   ship as the separate pleno-recognizers package — merged in 0.2.0)
#
# Server is delivered as a Docker image; NER models live on Hugging Face.
#
# Tag convention:
#   sdk/vX.Y.Z -> packages/sdk (PyPI name: pleno-anonymize)
#
# PyPI side: the project needs a GitHub Actions trusted publisher configured.
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'sdk/v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build wheel but skip PyPI upload'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
      contents: read
    concurrency:
      group: release-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Resolve dry-run flag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            dry_run="false"
          else
            dry_run="${INPUT_DRY_RUN:-true}"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME##*/v}"
          pkg_version=$(uvx --from "tomli>=2.0" python -c "
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          " packages/sdk/pyproject.toml)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${REF_NAME} does not match packages/sdk/pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build wheel and sdist
        working-directory: packages/sdk
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: packages/sdk
        run: ls -la dist

      - name: Publish to PyPI
        if: steps.resolve.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: packages/sdk/dist
