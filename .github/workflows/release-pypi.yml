name: Release packages to PyPI

# Trusted publishing for monorepo wheels. Two packages ship to PyPI:
#   - pleno-recognizers (recognizer registry, used as a library)
#   - pleno-anonymize   (SDK + CLI; depends on pleno-recognizers)
#
# Server is delivered as a Docker image; NER models live on Hugging Face.
#
# Tag conventions:
#   recognizers/vX.Y.Z   -> packages/recognizers
#   sdk/vX.Y.Z           -> packages/sdk (PyPI name: pleno-anonymize)
#
# PyPI side: each project needs a GitHub Actions trusted publisher
# configured (or a Pending Publisher for the first release).
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'recognizers/v*'
      - 'sdk/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to build'
        required: true
        type: choice
        options:
          - recognizers
          - sdk
      dry_run:
        description: 'Build wheel but skip PyPI upload'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
      contents: read
    concurrency:
      group: release-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Resolve package + dry-run flag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            dry_run="false"
            case "$REF_NAME" in
              recognizers/v*) package="recognizers" ;;
              sdk/v*)         package="sdk" ;;
              *)
                echo "::error::unrecognized tag: $REF_NAME"
                exit 1
                ;;
            esac
          else
            dry_run="${INPUT_DRY_RUN:-true}"
            package="${INPUT_PACKAGE}"
          fi
          case "$package" in
            recognizers) directory="packages/recognizers" ;;
            sdk)         directory="packages/sdk" ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          DIR: ${{ steps.resolve.outputs.directory }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME##*/v}"
          pkg_version=$(uvx --from "tomli>=2.0" python -c "
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          " "${DIR}/pyproject.toml")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${REF_NAME} does not match ${DIR}/pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build wheel and sdist
        working-directory: ${{ steps.resolve.outputs.directory }}
        run: uv build --out-dir dist

      - name: List build artifacts
        working-directory: ${{ steps.resolve.outputs.directory }}
        run: ls -la dist

      - name: Publish to PyPI
        if: steps.resolve.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.resolve.outputs.directory }}/dist
